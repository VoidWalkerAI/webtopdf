<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web to PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #020617;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 0 0 1px #1e293b;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #020617;
      color: #e5e7eb;
      font-size: 1rem;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: 700;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 1.2em;
    }

    .error {
      color: #f87171;
    }

    .success {
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web → PDF</h1>

    <label for="url">Website URL</label>
    <input id="url" type="url" placeholder="https://example.com" />

    <label for="token">Access Token</label>
    <input id="token" type="text" placeholder="PASTE YOUR TOKEN" />

    <button id="generateBtn">Generate PDF</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const btn = document.getElementById("generateBtn");
    const statusEl = document.getElementById("status");

    btn.addEventListener("click", async () => {
      const url = document.getElementById("url").value.trim();
      const token = document.getElementById("token").value.trim();

      statusEl.textContent = "";
      statusEl.className = "status";

      if (!url || !token) {
        statusEl.textContent = "URL and token are required.";
        statusEl.classList.add("error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Generating…";

      try {
        const res = await fetch("/api/web-to-pdf", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, token })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Request failed");
        }

        const blob = await res.blob();
        const jobId = res.headers.get("X-Job-Id") || "webtopdf";
        const remaining = res.headers.get("X-Credits-Remaining");

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `webtopdf_${jobId}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusEl.textContent =
          remaining !== null
            ? `PDF ready. Credits remaining: ${remaining}`
            : "PDF ready.";
        statusEl.classList.add("success");

      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.classList.add("error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate PDF";
      }
    });
  </script>
</body>
</html>
