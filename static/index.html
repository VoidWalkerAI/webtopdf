<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebToPDF</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f19; color:#e7e9ee; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
    .card { background:#121a2b; border:1px solid rgba(255,255,255,.10); border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 6px 0 14px; color: rgba(231,233,238,.85); line-height: 1.4; }
    label { display:block; font-weight: 700; margin: 8px 0; }
    input[type="url"]{
      width:100%; box-sizing: border-box; padding: 14px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14); background: #0c1220; color:#e7e9ee;
      outline: none;
    }
    .row { display:flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    button {
      padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16);
      background: #1f2a44; color:#e7e9ee; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .pill { display:inline-block; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10); }
    .msg { margin-top: 12px; padding: 10px 12px; border-radius: 12px; border:1px solid rgba(255,255,255,.10); background: rgba(0,0,0,.25); }
    .muted { color: rgba(231,233,238,.75); font-size: 13px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="pill">WebToPDF • MVP</div>
      <h1>Turn a URL into a PDF</h1>
      <p>Paste a link. Press the button. Get the file.</p>

      <label for="url">URL</label>
      <input id="url" type="url" placeholder="https://example.com" autocomplete="off" />

      <div class="row">
        <button id="go">Forge PDF</button>
        <button id="health" type="button">Check Health</button>
      </div>

      <div id="out" class="msg muted">Waiting.</div>

      <p class="muted" style="margin-top:14px;">
        Health endpoint: <code>/api/health</code><br/>
        Convert endpoint: <code>/api/convert</code> (expects JSON: <code>{ "url": "..." }</code>)
      </p>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const out = $("out");
  const btnGo = $("go");
  const btnHealth = $("health");

  function say(msg) { out.classList.remove("muted"); out.textContent = msg; }
  function idle(msg) { out.classList.add("muted"); out.textContent = msg; }

  btnHealth.addEventListener("click", async () => {
    idle("Checking /api/health …");
    try {
      const r = await fetch("/api/health", { method: "GET" });
      const j = await r.json();
      say("Health: " + JSON.stringify(j));
    } catch (e) {
      say("Health check failed: " + (e?.message || e));
    }
  });

  btnGo.addEventListener("click", async () => {
    const url = $("url").value.trim();
    if (!url) return say("Give me a URL.");

    btnGo.disabled = true;
    idle("Forging PDF…");

    try {
      const r = await fetch("/api/convert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      if (!r.ok) {
        const t = await r.text();
        throw new Error("Convert failed (" + r.status + "): " + t);
      }

      const blob = await r.blob();
      const a = document.createElement("a");
      const safe = (new URL(url)).hostname.replace(/[^a-z0-9.-]/gi, "_");
      a.href = URL.createObjectURL(blob);
      a.download = `webtopdf_${safe}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);

      say("Done. PDF downloaded.");
    } catch (e) {
      say("Error: " + (e?.message || e));
    } finally {
      btnGo.disabled = false;
    }
  });
</script>
</body>
</html>
